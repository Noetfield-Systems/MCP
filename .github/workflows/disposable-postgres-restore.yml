name: Disposable PostgreSQL Backup and Restore Acceptance
on:
  pull_request:
    paths:
      - "src/db.mjs"
      - "src/order-acceptance.mjs"
      - "scripts/isolated-postgres-restore-drill.mjs"
      - ".github/workflows/disposable-postgres-restore.yml"
  push:
    branches: [main]
    paths:
      - "src/db.mjs"
      - "src/order-acceptance.mjs"
      - "scripts/isolated-postgres-restore-drill.mjs"
      - ".github/workflows/disposable-postgres-restore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry_ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundry_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies and PostgreSQL client
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Create disposable source and target databases; dump and restore with real SQL readback
        env:
          DRILL_ADMIN_URL: postgresql://foundry_ci:ci-disposable-only@127.0.0.1:5432/postgres
        run: node scripts/isolated-postgres-restore-drill.mjs
      - name: Truth boundary
        run: |
          echo "PASS certifies a disposable isolated database backup/restore drill only."
          echo "Production backup schedule, retention, encryption and recovery remain separately verified."
